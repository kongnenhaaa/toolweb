<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSM Pro - Web Interface</title>
    <link rel="stylesheet" href="index.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo" id="logo-home" style="cursor: pointer;">
                <i data-lucide="cpu" class="logo-icon"></i>
                <span>GSM PRO</span>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active" id="nav-active">
                    <i data-lucide="smartphone"></i>
                    Đang hoạt động
                </a>
                <a href="#" class="nav-item" id="nav-history">
                    <i data-lucide="history"></i>
                    Lịch sử OTP
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="settings"></i>
                    Cài đặt
                </a>
            </nav>

        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <h1 id="page-title">Quản lý Cổng SIM</h1>
                <div class="actions">
                    <div class="system-status" style="display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); border-radius: 6px; font-size: 13px;">
                        <div class="status-indicator online"></div>
                        <span style="color: var(--text-main); font-weight: 500;">Đang kết nối...</span>
                    </div>
                    <button class="btn btn-secondary" onclick="manualRefresh()">
                        <i data-lucide="refresh-cw"></i> Làm mới
                    </button>
                    <button class="btn btn-secondary" onclick="checkAllBalance()">
                        <i data-lucide="wallet"></i> Kiểm tra TKC tất cả
                    </button>
                    <button class="btn btn-secondary" onclick="simulateIncomingOtp()">
                        <i data-lucide="test-tube"></i> Test OTP
                    </button>
                    <div class="user-profile">
                        <img src="https://ui-avatars.com/api/?name=CTV&background=0D8ABC&color=fff" alt="User">
                    </div>
                </div>
            </header>

            <div class="content-area" id="active-view">
                <div class="filter-bar" id="port-filters" style="display: flex; gap: 16px; margin-bottom: 16px; align-items: center; background: rgba(255,255,255,0.02); padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border-color);">
                    <div style="font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 8px;">
                        <i data-lucide="users"></i> Chia nhóm:
                    </div>
                    <div class="form-group" style="margin-bottom: 0; display: flex; align-items: center; gap: 8px;">
                        <label style="font-size: 13px; color: var(--text-muted); margin-bottom: 0; cursor: pointer;" for="split-workers">Số người làm:</label>
                        <input type="number" id="split-workers" min="1" value="1" style="width: 80px; padding: 6px 12px; height: auto;" onchange="updateSplitSelect(); renderPorts();">
                    </div>
                    <div class="form-group" style="margin-bottom: 0; display: flex; align-items: center; gap: 8px;">
                        <label style="font-size: 13px; color: var(--text-muted); margin-bottom: 0; cursor: pointer;" for="split-part">Phần của tôi:</label>
                        <select id="split-part" style="width: 100px; padding: 6px 12px; height: auto;" onchange="renderPorts();">
                            <option value="1">Phần 1</option>
                        </select>
                    </div>
                </div>

                <div class="grid-container">
                    <div class="grid-header">
                        <div class="col-status">TT</div>
                        <div class="col-port">Cổng</div>
                        <div class="col-phone">Số Điện Thoại</div>
                        <div class="col-tkc">Số Dư</div>
                        <div class="col-otp">OTP Gần Nhất</div>
                        <div class="col-actions">Hành Động</div>
                    </div>
                    <div class="grid-body" id="ports-container">
                        <!-- Port rows will be generated by JS -->
                    </div>
                </div>
            </div>

            <div class="content-area" id="history-view" style="display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                    <h2 style="font-family: 'Outfit', sans-serif; font-size: 20px;">Lịch Sử OTP Đã Dùng</h2>
                    <button class="btn btn-success" onclick="exportHistoryToExcel()">
                        <i data-lucide="download"></i> Xuất Excel
                    </button>
                </div>
                <div class="grid-container">
                    <div class="grid-header">
                        <div class="col-port">Cổng</div>
                        <div class="col-phone">Số Điện Thoại</div>
                        <div class="col-otp">OTP Đã Nhận</div>
                        <div class="col-time">Thời Gian</div>
                        <div class="col-actions">Hành Động</div>
                    </div>
                    <div class="grid-body" id="history-container">
                        <!-- History rows will be generated by JS -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Send SMS -->
    <div class="modal-overlay" id="sms-modal">
        <div class="modal">
            <div class="modal-header">
                <h2>Gửi SMS Lấy OTP</h2>
                <button class="close-btn" onclick="closeModal('sms-modal')"><i data-lucide="x"></i></button>
            </div>
            <div class="modal-body">
                <p>Bạn đang sử dụng cổng: <strong id="sms-port-name"></strong> (<span id="sms-phone-number"></span>)</p>
                <div class="form-group">
                    <label>Chọn tổng đài nhận:</label>
                    <select id="sms-recipient-select" onchange="toggleCustomRecipient()">
                        <option value="8500">8500 (Zalo)</option>
                        <option value="7539">7539 (Zalo)</option>
                        <option value="custom">Nhập số khác...</option>
                    </select>
                    <input type="text" id="sms-recipient-custom" placeholder="Ví dụ: 8088" style="display: none; margin-top: 8px;">
                </div>
                <div class="form-group">
                    <label>Nội dung tin nhắn (Cú pháp):</label>
                    <input type="text" id="sms-content" placeholder="Ví dụ: ZALO gửi 8500">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeModal('sms-modal')">Hủy</button>
                <button class="btn btn-primary" onclick="executeSendSms()"><i data-lucide="send"></i> Gửi SMS</button>
            </div>
        </div>
    </div>



    <!-- Notification Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Firebase JS SDK (v8 compat cho web thuần không dùng webpack) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script src="app.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
