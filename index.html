<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSM Pro - Web Interface</title>
    <link rel="stylesheet" href="index.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i data-lucide="cpu" class="logo-icon"></i>
                <span>GSM PRO</span>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active" id="nav-active">
                    <i data-lucide="smartphone"></i>
                    Đang hoạt động
                </a>
                <a href="#" class="nav-item" id="nav-history">
                    <i data-lucide="history"></i>
                    Lịch sử OTP
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="settings"></i>
                    Cài đặt
                </a>
            </nav>
            <div class="system-status">
                <div class="status-indicator online"></div>
                <span>Hệ thống trực tuyến (32 Cổng)</span>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <h1 id="page-title">Quản lý Cổng SIM</h1>
                <div class="actions">
                    <button class="btn btn-secondary" onclick="manualRefresh()">
                        <i data-lucide="refresh-cw"></i> Làm mới
                    </button>
                    <button class="btn btn-secondary" onclick="simulateIncomingOtp()">
                        <i data-lucide="test-tube"></i> Test OTP
                    </button>
                    <div class="user-profile">
                        <img src="https://ui-avatars.com/api/?name=CTV&background=0D8ABC&color=fff" alt="User">
                    </div>
                </div>
            </header>

            <div class="content-area" id="active-view">
                <div class="grid-container">
                    <div class="grid-header">
                        <div class="col-status">TT</div>
                        <div class="col-port">Cổng</div>
                        <div class="col-phone">Số Điện Thoại</div>
                        <div class="col-otp">OTP Gần Nhất</div>
                        <div class="col-actions">Hành Động</div>
                    </div>
                    <div class="grid-body" id="ports-container">
                        <!-- Port rows will be generated by JS -->
                    </div>
                </div>
            </div>

            <div class="content-area" id="history-view" style="display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                    <h2 style="font-family: 'Outfit', sans-serif; font-size: 20px;">Lịch Sử OTP Đã Dùng</h2>
                    <button class="btn btn-success" onclick="exportHistoryToExcel()">
                        <i data-lucide="download"></i> Xuất Excel
                    </button>
                </div>
                <div class="grid-container">
                    <div class="grid-header">
                        <div class="col-port">Cổng</div>
                        <div class="col-phone">Số Điện Thoại</div>
                        <div class="col-otp">OTP Đã Nhận</div>
                        <div class="col-time">Thời Gian</div>
                    </div>
                    <div class="grid-body" id="history-container">
                        <!-- History rows will be generated by JS -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Send SMS -->
    <div class="modal-overlay" id="sms-modal">
        <div class="modal">
            <div class="modal-header">
                <h2>Gửi SMS Lấy OTP</h2>
                <button class="close-btn" onclick="closeModal('sms-modal')"><i data-lucide="x"></i></button>
            </div>
            <div class="modal-body">
                <p>Bạn đang sử dụng cổng: <strong id="sms-port-name"></strong> (<span id="sms-phone-number"></span>)</p>
                <div class="form-group">
                    <label>Chọn tổng đài nhận:</label>
                    <select id="sms-recipient-select" onchange="toggleCustomRecipient()">
                        <option value="8500">8500 (Zalo)</option>
                        <option value="7539">7539 (Zalo)</option>
                        <option value="custom">Nhập số khác...</option>
                    </select>
                    <input type="text" id="sms-recipient-custom" placeholder="Ví dụ: 8088" style="display: none; margin-top: 8px;">
                </div>
                <div class="form-group">
                    <label>Nội dung tin nhắn (Cú pháp):</label>
                    <input type="text" id="sms-content" placeholder="Ví dụ: ZALO gửi 8500">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeModal('sms-modal')">Hủy</button>
                <button class="btn btn-primary" onclick="executeSendSms()"><i data-lucide="send"></i> Gửi SMS</button>
            </div>
        </div>
    </div>



    <!-- Notification Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="app.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
